  <path d="M 171 63 Q 168 72 170 81" stroke="#2A1810" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 166 59 Q 162 67 164 75" stroke="#2A1810" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M 206 71 Q 204 80 198 86" stroke="#2A1810" stroke-width="3" stroke-linecap="round" fill="none" />

