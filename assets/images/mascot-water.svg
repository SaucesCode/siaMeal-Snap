  <path d="M 167 89 L 169 94 L 174 96 L 169 98 L 167 103 L 165 98 L 160 96 L 165 94 Z" fill="#7CE8F8" />
  <path d="M 204 111 L 206 115 L 210 117 L 206 119 L 204 123 L 202 119 L 198 117 L 202 115 Z" fill="#7CE8F8" />

