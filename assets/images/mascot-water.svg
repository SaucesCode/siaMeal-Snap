  <!-- Whiskers -->
  <line x1="48" y1="108" x2="64" y2="107" stroke="#2A1810" stroke-width="4" stroke-linecap="round" />
  <line x1="51" y1="117" x2="65" y2="113" stroke="#2A1810" stroke-width="4" stroke-linecap="round" />
  <line x1="172" y1="108" x2="156" y2="107" stroke="#2A1810" stroke-width="4" stroke-linecap="round" />
  <line x1="169" y1="117" x2="155" y2="113" stroke="#2A1810" stroke-width="4" stroke-linecap="round" />
