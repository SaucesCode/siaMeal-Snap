<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="scanConeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#28F59C" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#28F59C" stop-opacity="0.06" />
    </linearGradient>
    <linearGradient id="scannerIris" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38F8A6" />
      <stop offset="100%" stop-color="#0CAE6B" />
    </linearGradient>
  </defs>

  <!-- 1. S-CURVED SIAMESE TAIL (RIGHT) -->
  <path
    d="M 171 135 C 186 124 176 92 178 74 C 179 60 198 60 197 73 C 196 84 188 94 191 112 C 194 128 186 142 174 146 Z"
    fill="#4B3329"
    stroke="#2A1810"
    stroke-width="4.5"
    stroke-linejoin="round"
  />

  <!-- 2. STANDING BODY & 4 LEGS WITH DARK SOCK PAWS -->
  <!-- Far Back Leg -->
  <path
    d="M 142 162 L 142 184 C 142 192 155 192 155 184 L 155 162 Z"
    fill="#3D2820"
    stroke="#2A1810"
    stroke-width="4.2"
  />
  <!-- Standing Torso & Legs -->
  <path
    d="M 88 134 C 82 152 84 178 88 188 L 106 188 L 106 168 C 122 172 138 170 156 162 C 162 174 162 184 164 190 C 166 196 179 194 180 184 C 182 166 184 142 168 128 C 154 118 112 122 88 134 Z"
    fill="#F7EBD6"
    stroke="#2A1810"
    stroke-width="4.5"
    stroke-linejoin="round"
  />
  <!-- Front Left Sock Paw -->
  <path
    d="M 122 165 L 122 191 C 122 200 140 200 140 191 L 140 165 Z"
    fill="#F7EBD6"
    stroke="#2A1810"
    stroke-width="4.5"
  />
  <path
    d="M 122 181 C 127 179 135 179 140 181 L 140 192 C 140 200 122 200 122 192 Z"
    fill="#4B3329"
    stroke="#2A1810"
    stroke-width="4.2"
  />
  <!-- Back Right Sock Paw -->
  <path
    d="M 164 176 C 169 174 176 174 180 176 L 180 187 C 180 195 164 195 164 187 Z"
    fill="#4B3329"
    stroke="#2A1810"
    stroke-width="4.2"
  />

  <!-- 3. POINTED EARS & HEAD -->
  <!-- Left Ear -->
  <path
    d="M 60 88 C 56 58 61 36 70 33 C 79 31 95 48 103 62 Z"
    fill="#4B3329"
    stroke="#2A1810"
    stroke-width="5"
    stroke-linejoin="round"
  />
  <path d="M 66 82 C 64 60 67 43 73 41 C 79 40 90 52 96 63 Z" fill="#7D5243" />

  <!-- Right Ear -->
  <path
    d="M 159 88 C 163 58 158 36 149 33 C 140 31 124 48 116 62 Z"
    fill="#4B3329"
    stroke="#2A1810"
    stroke-width="5"
    stroke-linejoin="round"
  />
  <path d="M 153 82 C 155 60 152 43 146 41 C 140 40 129 52 123 63 Z" fill="#7D5243" />

  <!-- Rounded Cream Head -->
  <ellipse
    cx="110"
    cy="97"
    rx="54"
    ry="42"
    fill="#F7EBD6"
    stroke="#2A1810"
    stroke-width="5"
  />

  <!-- Contoured Siamese Mask -->
  <path
    d="M 68 104 C 68 88 82 82 95 76 C 103 70 106 66 110 66 C 114 66 117 70 125 76 C 138 82 152 88 152 104 C 152 120 133 125 123 130 C 116 134 113 136 110 136 C 107 136 104 134 97 130 C 87 125 68 120 68 104 Z"
    fill="#4B3329"
  />

  <!-- 4. RIGHT EYE (WINKING CHEVRON) & MOUTH -->
  <path
    d="M 140 93 C 132 95 126 99 124 102 C 129 102 135 103 140 106"
    stroke="#2A1810"
    stroke-width="4.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Nose & Happy Open Mouth -->
  <path d="M 104 109 C 104 106 114 106 114 109 C 114 113 109 115 109 115 Z" fill="#2A1810" />
  <path
    d="M 100 115 C 102 128 116 128 118 115 Z"
    fill="#331812"
    stroke="#2A1810"
    stroke-width="3"
    stroke-linejoin="round"
  />
  <ellipse cx="109" cy="122" rx="5.2" ry="3" fill="#F77E8B" />
  <path
    d="M 97 113 C 101 118 107 118 109 113 C 111 118 117 118 121 113"
    stroke="#2A1810"
    stroke-width="3.8"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Whiskers -->
  <line x1="48" y1="108" x2="64" y2="107" stroke="#2A1810" stroke-width="4" stroke-linecap="round" />
  <line x1="51" y1="117" x2="65" y2="113" stroke="#2A1810" stroke-width="4" stroke-linecap="round" />
  <line x1="172" y1="108" x2="156" y2="107" stroke="#2A1810" stroke-width="4" stroke-linecap="round" />
  <line x1="169" y1="117" x2="155" y2="113" stroke="#2A1810" stroke-width="4" stroke-linecap="round" />

  <!-- 5. HEALTHY SALAD / POKE BOWL (BOTTOM LEFT) -->
  <g>
    <!-- Green Lettuce & Kale Leaves -->
    <path
      d="M 48 175 C 44 164 53 156 61 162 C 63 153 74 152 79 160 C 86 151 98 153 101 162 C 109 156 119 162 117 173 L 120 176 L 46 176 Z"
      fill="#76C945"
      stroke="#2A1810"
      stroke-width="3.8"
      stroke-linejoin="round"
    />
    <!-- Boiled Egg Slice -->
    <ellipse cx="88" cy="169" rx="10" ry="7" fill="#FAF8F0" stroke="#2A1810" stroke-width="3" />
    <!-- Orange Salmon Fillet Slice with Stripes -->
    <path
      d="M 88 177 C 92 165 108 164 116 171 C 118 176 112 182 94 182 Z"
      fill="#F97E52"
      stroke="#2A1810"
      stroke-width="3.2"
      stroke-linejoin="round"
    />
    <path d="M 96 171 Q 102 174 104 179" stroke="#FFD6C4" stroke-width="2" fill="none" />
    <path d="M 103 169 Q 109 172 111 177" stroke="#FFD6C4" stroke-width="2" fill="none" />
    <!-- Red Berries / Cherry Tomatoes -->
    <circle cx="77" cy="173" r="5" fill="#E04848" stroke="#2A1810" stroke-width="2.8" />
    <circle cx="84" cy="177" r="4.8" fill="#E04848" stroke="#2A1810" stroke-width="2.8" />
    <circle cx="99" cy="182" r="3.8" fill="#C82838" stroke="#2A1810" stroke-width="2.5" />
    <circle cx="106" cy="181" r="3.8" fill="#C82838" stroke="#2A1810" stroke-width="2.5" />
    <!-- Avocado Half with Pit -->
    <path
      d="M 59 170 C 64 166 78 174 79 183 C 74 186 61 185 58 177 Z"
      fill="#C5E063"
      stroke="#2A1810"
      stroke-width="3.2"
      stroke-linejoin="round"
    />
    <circle cx="69" cy="179" r="4" fill="#5C3824" stroke="#2A1810" stroke-width="2.2" />

    <!-- Ceramic Bowl Base -->
    <path
      d="M 45 174 C 46 196 64 205 84 205 C 104 205 122 196 123 174 C 106 184 62 184 45 174 Z"
      fill="#E2F2EA"
      stroke="#2A1810"
      stroke-width="4.2"
      stroke-linejoin="round"
    />
    <!-- Bowl Shadow Curve -->
    <path
      d="M 94 181 C 106 180 116 178 121 175 C 119 193 104 202 85 203 C 96 198 98 189 94 181 Z"
      fill="#94C2B0"
    />
  </g>

  <!-- 6. LASER SCAN BEAM CONE & TARGET CROSSHAIR -->
  <g>
    <!-- Translucent Laser Scan Cone -->
    <polygon
      points="85,108 55,168 115,168"
      fill="url(#scanConeGrad)"
    />
    <!-- Vertical & Horizontal Target Crosshair Lines -->
    <line x1="85" y1="120" x2="85" y2="142" stroke="#28F59C" stroke-width="3" stroke-linecap="round" />
    <line x1="85" y1="150" x2="85" y2="173" stroke="#28F59C" stroke-width="3" stroke-linecap="round" />
    <line x1="52" y1="145" x2="77" y2="145" stroke="#28F59C" stroke-width="3" stroke-linecap="round" />
    <line x1="93" y1="145" x2="118" y2="145" stroke="#28F59C" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- 7. LEFT EYE (GLOWING 6-BLADE CAMERA SHUTTER) -->
  <g>
    <circle cx="85" cy="99" r="14.5" fill="#28F59C" opacity="0.35" />
    <circle cx="85" cy="99" r="12.5" fill="url(#scannerIris)" stroke="#141F1A" stroke-width="2.5" />
    <polygon
      points="85,93 90,96 90,102 85,105 80,102 80,96"
      fill="#141F1A"
    />
    <line x1="85" y1="93" x2="92" y2="88" stroke="#141F1A" stroke-width="2.2" />
    <line x1="90" y1="96" x2="97" y2="99" stroke="#141F1A" stroke-width="2.2" />
    <line x1="90" y1="102" x2="92" y2="110" stroke="#141F1A" stroke-width="2.2" />
    <line x1="85" y1="105" x2="78" y2="110" stroke="#141F1A" stroke-width="2.2" />
    <line x1="80" y1="102" x2="73" y2="99" stroke="#141F1A" stroke-width="2.2" />
    <line x1="80" y1="96" x2="78" y2="88" stroke="#141F1A" stroke-width="2.2" />
  </g>
</svg>
