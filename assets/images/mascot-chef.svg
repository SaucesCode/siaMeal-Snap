<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="chefEye" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#35ECC4" />
      <stop offset="100%" stop-color="#0EA88A" />
    </linearGradient>
    <linearGradient id="chefLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7EE058" />
      <stop offset="100%" stop-color="#4EB338" />
    </linearGradient>
  </defs>

  <!-- 1. S-CURVED SIAMESE TAIL HOLDING THE 3-PRONG SILVER FORK (RIGHT) -->
  <g>
    <!-- Tail Base & Upper Curve (Anchored deep behind torso at x=146) -->
    <path
      d="M 146 194 C 184 192 174 156 178 134 C 180 120 198 118 198 131 C 198 142 186 146 188 162 C 190 182 180 198 152 201 Z"
      fill="#4B3329"
      stroke="#2A1810"
      stroke-width="4.5"
      stroke-linejoin="round"
    />
    <!-- Silver 3-Prong Fork Held Upright by Tail Tip -->
    <path
      d="M 183 158 L 191 112 C 185 109 183 102 184 93 L 188 93 L 188 103 L 191 103 L 192 93 L 196 93 L 195 103 L 198 103 L 199 94 L 203 94 C 203 103 200 110 195 113 L 188 159 Z"
      fill="#DCE3EA"
      stroke="#2A1810"
      stroke-width="3.4"
      stroke-linejoin="round"
    />
    <!-- Tail Tip Wrapping Around Fork Handle -->
    <ellipse
      cx="189"
      cy="134"
      rx="10"
      ry="6.5"
      transform="rotate(-12 189 134)"
      fill="#4B3329"
      stroke="#2A1810"
      stroke-width="4"
    />
  </g>

  <!-- 2. SITTING TORSO & SHOULDERS -->
  <path
    d="M 74 140 C 66 164 68 198 84 203 L 154 203 C 168 198 164 164 148 138 Z"
    fill="#F7EBD6"
    stroke="#2A1810"
    stroke-width="4.5"
    stroke-linejoin="round"
  />
  <!-- Neck / Chest Shadow -->
  <path
    d="M 88 136 C 102 146 124 146 140 136 L 136 154 L 92 154 Z"
    fill="#E5CDB4"
  />

  <!-- 3. WHITE CHEF APRON WITH POCKET & SIDE BOW -->
  <!-- Apron Tie & Bow on Right Hip -->
  <path
    d="M 145 170 L 162 161 C 167 157 171 163 165 167 L 169 171 C 172 175 166 179 161 173 L 145 176 Z"
    fill="#FFFFFF"
    stroke="#2A1810"
    stroke-width="3.8"
    stroke-linejoin="round"
  />
  <!-- Apron Bib & Skirt -->
  <path
    d="M 86 138 L 93 155 L 127 155 L 141 136 L 147 139 L 133 158 L 137 198 C 117 202 98 201 84 196 L 89 158 L 81 141 Z"
    fill="#FFFFFF"
    stroke="#2A1810"
    stroke-width="4.2"
    stroke-linejoin="round"
  />
  <!-- Apron Buttons -->
  <circle cx="96" cy="159" r="2" fill="#2A1810" />
  <circle cx="124" cy="159" r="2" fill="#2A1810" />
  <!-- Apron Front Pocket -->
  <path
    d="M 99 175 L 121 175 L 121 185 C 121 192 99 192 99 185 Z"
    fill="#F2F6FA"
    stroke="#2A1810"
    stroke-width="3.5"
    stroke-linejoin="round"
  />

  <!-- 4. SYMMETRICAL FRONT PAWS TUCKED NEATLY IN FRONT -->
  <!-- Left Front Paw -->
  <path
    d="M 90 193 C 90 186 106 186 106 193 L 106 202 C 106 207 90 207 90 202 Z"
    fill="#4B3329"
    stroke="#2A1810"
    stroke-width="4"
  />
  <!-- Right Front Paw -->
  <path
    d="M 118 193 C 118 186 134 186 134 193 L 134 202 C 134 207 118 207 118 202 Z"
    fill="#4B3329"
    stroke="#2A1810"
    stroke-width="4"
  />

  <!-- 5. BACK PAWS WITH PINK TOE BEANS -->
  <!-- Left Foot -->
  <g transform="translate(73, 194)">
    <ellipse cx="0" cy="0" rx="13" ry="12" fill="#4B3329" stroke="#2A1810" stroke-width="4.2" />
    <ellipse cx="0" cy="4" rx="5.2" ry="4.2" fill="#A56E63" />
    <circle cx="-5.5" cy="-3.5" r="2.3" fill="#A56E63" />
    <circle cx="0" cy="-5" r="2.3" fill="#A56E63" />
    <circle cx="5.5" cy="-3.5" r="2.3" fill="#A56E63" />
  </g>
  <!-- Right Foot -->
  <g transform="translate(155, 194)">
    <ellipse cx="0" cy="0" rx="13" ry="12" fill="#4B3329" stroke="#2A1810" stroke-width="4.2" />
    <ellipse cx="0" cy="4" rx="5.2" ry="4.2" fill="#A56E63" />
    <circle cx="-5.5" cy="-3.5" r="2.3" fill="#A56E63" />
    <circle cx="0" cy="-5" r="2.3" fill="#A56E63" />
    <circle cx="5.5" cy="-3.5" r="2.3" fill="#A56E63" />
  </g>

  <!-- 6. POINTED EARS & TOP SPROUT -->
  <!-- Left Ear -->
  <path
    d="M 59 92 C 55 62 60 39 69 36 C 78 34 94 50 102 64 Z"
    fill="#4B3329"
    stroke="#2A1810"
    stroke-width="5"
    stroke-linejoin="round"
  />
  <path d="M 65 86 C 63 64 66 46 72 44 C 78 43 89 55 95 66 Z" fill="#7D5243" />

  <!-- Right Ear -->
  <path
    d="M 161 92 C 165 62 160 39 151 36 C 142 34 126 50 118 64 Z"
    fill="#4B3329"
    stroke="#2A1810"
    stroke-width="5"
    stroke-linejoin="round"
  />
  <path d="M 155 86 C 157 64 154 46 148 44 C 142 43 131 55 125 66 Z" fill="#7D5243" />

  <!-- Top Sprout -->
  <g>
    <path d="M 110 64 L 110 46" stroke="#2A1810" stroke-width="4" stroke-linecap="round" />
    <path
      d="M 110 49 C 98 50 93 42 94 35 C 102 34 109 39 110 49 Z"
      fill="url(#chefLeaf)"
      stroke="#2A1810"
      stroke-width="3.2"
      stroke-linejoin="round"
    />
    <path
      d="M 110 49 C 111 38 119 32 128 33 C 128 43 121 50 110 49 Z"
      fill="url(#chefLeaf)"
      stroke="#2A1810"
      stroke-width="3.2"
      stroke-linejoin="round"
    />
  </g>

  <!-- 7. HEAD & CONTOURED SIAMESE MASK -->
  <ellipse
    cx="110"
    cy="101"
    rx="54"
    ry="43"
    fill="#F7EBD6"
    stroke="#2A1810"
    stroke-width="5"
  />
  <!-- Peaked Siamese Mask -->
  <path
    d="M 66 108 C 66 92 80 86 94 80 C 103 74 106 68 110 68 C 114 68 117 74 126 80 C 140 86 154 92 154 108 C 154 124 134 129 124 134 C 117 138 114 140 110 140 C 106 140 103 138 96 134 C 86 129 66 124 66 108 Z"
    fill="#4B3329"
  />

  <!-- 8. BIG GLOSSY TEAL-EMERALD EYES -->
  <g>
    <ellipse cx="86" cy="103" rx="12.5" ry="11.5" fill="url(#chefEye)" stroke="#2A1810" stroke-width="3.2" />
    <ellipse cx="88" cy="104" rx="7.5" ry="8" fill="#084C41" />
    <circle cx="84" cy="99" r="3.4" fill="#FFFFFF" />
    <circle cx="92" cy="108" r="1.5" fill="#FFFFFF" />
  </g>
  <g>
    <ellipse cx="134" cy="103" rx="12.5" ry="11.5" fill="url(#chefEye)" stroke="#2A1810" stroke-width="3.2" />
    <ellipse cx="132" cy="104" rx="7.5" ry="8" fill="#084C41" />
    <circle cx="129" cy="99" r="3.4" fill="#FFFFFF" />
    <circle cx="137" cy="108" r="1.5" fill="#FFFFFF" />
  </g>

  <!-- 9. NOSE, OPEN HAPPY MOUTH & WHISKERS -->
  <path d="M 105 113 C 105 110 115 110 115 113 C 115 117 110 119 110 119 Z" fill="#2A1810" />
  <path
    d="M 101 119 C 103 132 117 132 119 119 Z"
    fill="#331812"
    stroke="#2A1810"
    stroke-width="3"
    stroke-linejoin="round"
  />
  <ellipse cx="110" cy="126" rx="5.5" ry="3.2" fill="#F77E8B" />
  <path
    d="M 98 117 C 102 122 108 122 110 117 C 112 122 118 122 122 117"
    stroke="#2A1810"
    stroke-width="3.8"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Whiskers -->
  <line x1="47" y1="112" x2="64" y2="111" stroke="#2A1810" stroke-width="4" stroke-linecap="round" />
  <line x1="50" y1="121" x2="65" y2="117" stroke="#2A1810" stroke-width="4" stroke-linecap="round" />
  <line x1="173" y1="112" x2="156" y2="111" stroke="#2A1810" stroke-width="4" stroke-linecap="round" />
  <line x1="170" y1="121" x2="155" y2="117" stroke="#2A1810" stroke-width="4" stroke-linecap="round" />
</svg>
